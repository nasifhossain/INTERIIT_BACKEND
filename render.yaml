services:
  - type: web
    name: interiit-backend
    env: node
    plan: starter # or starter-plus, standard, pro
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
    healthCheckPath: /